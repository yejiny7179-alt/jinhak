<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대입전형 캘린더</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#F3FAF1;
    --surface:#FFFFFF;
    --ink:#20291F;
    --ink-soft:#6B7568;
    --line:#CDEAC7;
    --accent:#4FA84A;
    --accent-dark:#3D8A3A;
    --accent-soft:#E4F6DF;
    --accent-soft2:#CFF0C6;
    --danger:#D64545;
    --c-apply:#3B6FA6;
    --c-document:#2F8F8F;
    --c-recommend:#8A7A3B;
    --c-first:#D18B2E;
    --c-essay:#6B5CA6;
    --c-practical:#B2508C;
    --c-interview:#8E5EA7;
    --c-final:#C23B3B;
    --c-fill:#3B8C6E;
    --c-csat:#33415C;
    --c-register:#4C7A3B;
    --c-custom:#6B6B6B;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans KR', sans-serif;
    line-height:1.6;
    letter-spacing:-0.01em;
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,h3{font-family:'Noto Sans KR', sans-serif; font-weight:900; margin:0;}
  button{font-family:inherit;}
  .wrap{max-width:960px;margin:0 auto;padding:0 16px 64px;}

  header{border-bottom:3px solid var(--accent-soft2); background:linear-gradient(180deg, var(--accent-soft) 0%, var(--surface) 100%);}
  .header-inner{max-width:960px;margin:0 auto;padding:22px 16px 0;}
  .title-row{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:6px 16px;}
  header h1{font-size:28px;font-weight:900;letter-spacing:-0.01em;color:#111;}
  .subtitle{color:var(--ink-soft);font-size:13px;margin-top:2px;}
  .tabs{display:flex;gap:0;margin-top:18px;}
  .role-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:8px;}
  @media(max-width:640px){.role-grid{grid-template-columns:1fr;}}
  .role-card{
    background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--role-color, var(--accent));border-radius:8px;
    padding:22px 18px;text-align:left;cursor:pointer;
    display:flex;flex-direction:column;gap:8px;
    box-shadow:0 1px 3px rgba(60,120,50,0.06);
  }
  .role-card:hover{border-color:var(--role-color, var(--accent));box-shadow:0 4px 14px rgba(60,120,50,0.15);transform:translateY(-1px);}
  .role-card-title{font-family:'Noto Sans KR', sans-serif;font-size:24px;font-weight:900;color:var(--ink);}
  .role-card-desc{font-size:13px;color:var(--ink-soft);line-height:1.5;}
  .tab-btn{
    flex:1;
    background:none;border:none;
    padding:12px 4px 14px;
    font-size:14px;font-weight:500;
    color:var(--ink-soft);
    border-bottom:2px solid transparent;
    cursor:pointer;
  }
  .tab-btn.active{color:var(--ink);border-bottom-color:var(--accent);font-weight:700;}

  section.panel{padding-top:24px;}
  .section-title{font-size:17px;font-weight:700;margin-bottom:2px;padding-left:10px;border-left:4px solid var(--accent);color:var(--ink);}
  .section-desc{color:var(--ink-soft);font-size:13px;margin-bottom:14px;}
  hr.rule{border:none;border-top:1px solid var(--line);margin:28px 0;}

  .field-label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:4px;}
  input[type=text], input[type=password], input[type=date], input[type=file], select{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:3px;
    background:var(--surface);
    font-size:14px;
    color:var(--ink);
    font-family:inherit;
  }
  input[type=file]{padding:7px 8px;font-size:13px;}
  input:focus, select:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media(max-width:640px){.grid3{grid-template-columns:1fr;} .grid2{grid-template-columns:1fr;}}
  .field{margin-bottom:12px;}

  .event-row{display:grid;grid-template-columns:120px 1fr 1fr auto;gap:8px;align-items:end;margin-bottom:8px;}
  @media(max-width:640px){.event-row{grid-template-columns:1fr 1fr auto;grid-template-areas:"type type x" "date label label";}
    .event-row .ev-type{grid-area:type;} .event-row .ev-date{grid-area:date;} .event-row .ev-label{grid-area:label;} .event-row .ev-del{grid-area:x;}}
  .icon-btn{background:none;border:1px solid var(--line);border-radius:3px;width:36px;height:36px;cursor:pointer;color:var(--ink-soft);font-size:16px;line-height:1;}
  .icon-btn:hover{border-color:var(--danger);color:var(--danger);}
  .link-btn{background:none;border:none;color:var(--accent-dark);font-size:13px;font-weight:700;cursor:pointer;padding:4px 0;}

  .btn{
    background:var(--accent);color:#fff;border:none;border-radius:3px;
    padding:11px 20px;font-size:14px;font-weight:700;cursor:pointer;
    box-shadow:0 1px 2px rgba(60,120,50,0.25);
  }
  .btn:hover{background:var(--accent-dark);}
  .btn.secondary{background:var(--accent-soft);color:var(--accent-dark);border:1px solid var(--accent-soft2);box-shadow:none;}
  .btn.secondary:hover{background:var(--accent-soft2);color:var(--accent-dark);}
  .btn.danger{background:none;color:var(--danger);border:1px solid var(--danger);box-shadow:none;}
  .btn-row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}

  .uni-group{margin-bottom:20px;}
  .uni-group h3{font-size:15px;margin-bottom:6px;}
  .entry-row{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:10px 0;border-top:1px solid var(--line);
  }
  .entry-meta{font-size:13px;color:var(--ink-soft);}
  .entry-meta b{color:var(--ink);font-weight:500;}
  .entry-events{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
  .tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:20px;color:#fff;white-space:nowrap;}
  .entry-actions{display:flex;gap:6px;flex-shrink:0;}

  .empty{
    border:1px dashed var(--line);border-radius:4px;padding:28px 16px;text-align:center;color:var(--ink-soft);font-size:13px;
  }

  .search-box{margin-bottom:14px;}
  .result-list{border:1px solid var(--line);border-radius:4px;max-height:260px;overflow-y:auto;}
  .result-item{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px;
  }
  .result-item:last-child{border-bottom:none;}
  .result-item .add-btn{
    border:1px solid var(--accent);color:var(--accent);background:none;border-radius:20px;
    padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;
  }
  .result-item .add-btn:disabled{border-color:var(--line);color:var(--ink-soft);cursor:default;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
  .chip{
    display:flex;align-items:center;gap:6px;
    background:var(--surface);border:1px solid var(--line);border-radius:20px;
    padding:6px 8px 6px 12px;font-size:12px;
  }
  .chip button{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:14px;line-height:1;padding:0 2px;}

  .name-input-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
  .name-input-row input{max-width:200px;}

  .register-box, .gate-box{border:1px solid var(--line);border-radius:4px;padding:20px;max-width:360px;}
  .gate-note{color:var(--ink-soft);font-size:12px;margin-top:10px;}

  .view-switch{display:inline-flex;border:1px solid var(--line);border-radius:20px;overflow:hidden;margin-bottom:18px;}
  .view-switch button{
    background:none;border:none;padding:8px 18px;font-size:13px;font-weight:500;color:var(--ink-soft);cursor:pointer;
  }
  .view-switch button.active{background:var(--accent);color:#fff;}

  .filter-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px;}
  .filter-row .field{margin-bottom:0;min-width:140px;}
  .scope-note{color:var(--ink-soft);font-size:12px;margin-bottom:14px;}
  .session-bar{display:flex;justify-content:space-between;align-items:center;background:var(--accent-soft);border-radius:4px;padding:8px 12px;font-size:13px;margin-bottom:16px;}

  table.sched{width:100%;border-collapse:collapse;font-size:13px;}
  table.sched th{
    text-align:left;font-weight:500;color:var(--ink-soft);font-size:12px;
    border-bottom:1px solid var(--ink);padding:8px 8px;
  }
  table.sched td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top;}
  table.sched tr.today td{background:var(--accent-soft);}
  .dday{font-weight:700;font-variant-numeric:tabular-nums;}
  .dday.today{color:var(--danger);}
  .evtype{display:inline-flex;align-items:flex-start;gap:6px;font-size:12px;}
  .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:inline-block;margin-top:4px;}

  @media(max-width:640px){
    table.sched thead{display:none;}
    table.sched, table.sched tbody, table.sched tr, table.sched td{display:block;width:100%;}
    table.sched tr{border:1px solid var(--line);border-radius:4px;margin-bottom:10px;padding:10px 12px;}
    table.sched tr.today{border-color:var(--accent);}
    table.sched td{border:none;padding:3px 0;}
    table.sched td::before{content:attr(data-label);display:inline-block;min-width:64px;color:var(--ink-soft);font-size:11px;}
  }

  .calendar-card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;box-shadow:0 1px 4px rgba(60,120,50,0.08);}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .cal-head h3{font-size:18px;}
  .cal-nav{display:flex;gap:4px;}
  .cal-nav button{background:none;border:1px solid var(--line);border-radius:3px;width:32px;height:32px;cursor:pointer;font-size:14px;color:var(--ink-soft);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line);}
  .cal-dow{padding:8px 4px;text-align:center;font-size:12px;font-weight:500;color:var(--ink-soft);border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface);}
  .cal-dow.sun{color:var(--danger);}
  .cal-dow.sat{color:#3B5FA6;}
  .cal-cell{
    min-height:104px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);
    padding:6px 5px;background:var(--surface);cursor:pointer;position:relative;overflow:hidden;
  }
  .cal-cell.blank{background:var(--bg);cursor:default;}
  .cal-cell.selected{background:var(--accent-soft);}
  .cal-cell .num{font-size:13px;font-weight:600;color:var(--ink);}
  .cal-cell .num.sun{color:var(--danger);}
  .cal-cell .num.sat{color:#3B5FA6;}
  .cal-cell.is-today .num{color:#fff;background:var(--ink);border-radius:50%;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;}
  .cal-dots{display:flex;flex-direction:column;gap:2px;margin-top:5px;}
  .cal-event-row{display:flex;align-items:center;gap:4px;min-width:0;}
  .cal-event-row .dot{flex-shrink:0;}
  .cal-event-text{font-size:10px;color:var(--ink);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
  .cal-event-more{font-size:10px;color:var(--ink-soft);margin-top:1px;}
  .dot.lg{width:10px;height:10px;}
  @media(max-width:640px){
    .calendar-card{padding:12px;}
    .cal-cell{min-height:72px;padding:3px 3px;}
    .cal-dow{padding:5px 2px;font-size:10px;}
    .cal-event-text{font-size:8.5px;}
    .dot.lg{width:8px;height:8px;}
  }

  .day-detail{margin-top:16px;border:1px solid var(--line);border-radius:4px;padding:14px 16px;}
  .day-detail h4{font-size:14px;margin-bottom:8px;}
  .detail-row{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--line);font-size:13px;}
  .detail-row:first-of-type{border-top:none;}

  .legend{display:flex;flex-wrap:wrap;gap:10px 14px;margin-top:14px;font-size:11px;color:var(--ink-soft);}
  .legend span{display:inline-flex;align-items:center;gap:5px;}

  .roster{border:1px solid var(--line);border-radius:4px;margin-bottom:18px;}
  .roster-row{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer;}
  .roster-row:last-child{border-bottom:none;}
  .roster-row:hover{background:var(--bg);}
  .roster-row.active{background:var(--accent-soft);}
  .roster-row .cnt{color:var(--ink-soft);font-size:12px;}

  .pin-list{border:1px solid var(--line);border-radius:4px;margin-bottom:14px;}
  .pin-row{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px;}
  .pin-row:last-child{border-bottom:none;}
  .pin-code{font-variant-numeric:tabular-nums;letter-spacing:0.05em;color:var(--ink-soft);}

  .import-box{border:1px solid var(--line);border-radius:4px;padding:16px;}
  .import-preview{border:1px solid var(--accent);border-radius:4px;padding:14px 16px;margin-top:12px;background:var(--accent-soft);}

  footer{max-width:960px;margin:0 auto;padding:20px 16px 40px;color:var(--ink-soft);font-size:12px;}
</style>
</head>

    <div class="title-row">
      <h1>대입전형 캘린더</h1>

    </div>
    <div class="subtitle">잘 해왔고, 잘하고 있고, 잘될거야 🍀</div>

  </div>
</header>

<div class="wrap">
  <div id="app"></div>
</div>


<script>
const EVENT_TYPES = {
  apply:      { label:'원서접수',     color:'var(--c-apply)' },
  document:   { label:'서류제출',     color:'var(--c-document)' },
  first:      { label:'1단계합격',    color:'var(--c-first)' },
  essay:      { label:'논술',         color:'var(--c-essay)' },
  practical:  { label:'실기',         color:'var(--c-practical)' },
  interview:  { label:'면접',         color:'var(--c-interview)' },
  final:      { label:'최종합격',     color:'var(--c-final)' },
  fill:       { label:'충원합격',     color:'var(--c-fill)' },
  csat:       { label:'수능',         color:'var(--c-csat)' },
  register:   { label:'등록',         color:'var(--c-register)' },
  custom:     { label:'기타',         color:'var(--c-custom)' }
};

// 엑셀 '구분' 텍스트 -> 내부 유형 매칭 (부분일치)
const TYPE_MAP = [
  ['원서접수','apply'], ['접수마감','apply'],
  ['서류','document'],
  ['추천','document'],
  ['1단계','first'], ['1차합격','first'], ['1차 합격','first'],
  ['논술','essay'],
  ['실기','practical'],
  ['면접','interview'],
  ['최종합격','final'], ['최종 합격','final'],
  ['충원','fill'],
  ['수능','csat'],
  ['등록','register']
];

/* 저장 기능(window.storage)이 없는 환경(파일을 그냥 열었을 때 등)을 위한 안전장치.
   실제로는 데이터가 저장/공유되지 않고, 이 화면을 여는 동안만 메모리에 남아있어요. */
let storageIsFallback = false;
(function ensureStorage(){
  if(window.storage && typeof window.storage.get === 'function') return;
  storageIsFallback = true;
  const mem = {};
  const keyOf = (k, shared) => (shared ? 'S:' : 'P:') + k;
  window.storage = {
    get: async (k, shared) => { const kk = keyOf(k, shared); return mem[kk] !== undefined ? { key:k, value:mem[kk], shared } : null; },
    set: async (k, v, shared) => { const kk = keyOf(k, shared); mem[kk] = v; return { key:k, value:v, shared }; },
    delete: async (k, shared) => { const kk = keyOf(k, shared); const existed = mem[kk] !== undefined; delete mem[kk]; return { key:k, deleted:existed, shared }; },
    list: async () => ({ keys: [] })
  };
})();
function showBanner(msg){
  const el = document.getElementById('globalBanner');
  if(!el) return;
  el.textContent = msg;
  el.style.display = 'block';
}
function clearBanner(){
  const el = document.getElementById('globalBanner');
  if(el) el.style.display = 'none';

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function pad(n){ return String(n).padStart(2,'0'); }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function fmtDate(s){ if(!s) return ''; const [y,m,d]=s.split('-'); return `${y}.${m}.${d}`; }
function escapeHtml(s){ const d=document.createElement('div'); d.textContent = s==null?'':s; return d.innerHTML; }
function ddayInfo(dateStr){
  const today = new Date(todayStr()+'T00:00:00');
  const d = new Date(dateStr+'T00:00:00');
  const diff = Math.round((d-today)/86400000);
  if(diff===0) return {label:'D-DAY', cls:'today'};
  if(diff>0) return {label:'D-'+diff, cls:''};
  return {label:'D+'+Math.abs(diff), cls:''};
}
function eventLabel(ev){
  const base = EVENT_TYPES[ev.type] ? EVENT_TYPES[ev.type].label : '기타';
  return ev.note ? `${base} · ${ev.note}` : base;
}
function eventColor(ev){
  return EVENT_TYPES[ev.type] ? EVENT_TYPES[ev.type].color : 'var(--c-custom)';
}
function deriveClassName(num){
  const digits = String(num||'').replace(/\D/g,'');
  if(digits.length < 4) return '미지정';
  const grade = digits[0];
  const rest = digits.slice(1);
  const classPart = rest.slice(0, rest.length-2);
  const classNum = parseInt(classPart, 10);
  if(isNaN(classNum)) return '미지정';
  return `${grade}학년 ${classNum}반`;
}

// 담임교사 코드 기본값: 1~11반 + 12반(테스트용). 관리자 탭에서 학급 수를 늘리거나 줄일 수 있어요.
function classPin(n){ return '2603' + String(n).padStart(2,'0'); }
const SEED_TEACHER_PINS = [
  ...Array.from({length:11}, (_,i)=>{
    const n = i+1;
    return { id:'auto-class-'+n, label:`3학년 ${n}반 담임`, className:`3학년 ${n}반`, pin:classPin(n), isAutoClass:true, classNum:n };
  }),
  { id:'seed-test', label:'3학년 12반 (테스트용)', className:'3학년 12반', pin:classPin(12), isTest:true }
];
function getAutoClassCount(){
  return teacherPins.filter(p=>p.isAutoClass && !p.isTest).length;
}
function setAutoClassCount(newCount){
  newCount = Math.max(1, Math.min(50, newCount|0));
  teacherPins = teacherPins.filter(p=> !(p.isAutoClass && !p.isTest && p.classNum > newCount));
  for(let n=1;n<=newCount;n++){
    if(!teacherPins.some(p=>p.isAutoClass && !p.isTest && p.classNum===n)){
      teacherPins.push({ id:'auto-class-'+n, label:`3학년 ${n}반 담임`, className:`3학년 ${n}반`, pin:classPin(n), isAutoClass:true, classNum:n });
    }
  }
  teacherPins.sort((a,b)=>{
    const an = a.isAutoClass ? a.classNum : 999;
    const bn = b.isAutoClass ? b.classNum : 999;
    return an-bn;
  });
}

async function loadAll(){
  try{ const r = await window.storage.get('master_schedule', true); masterData = r ? JSON.parse(r.value) : []; }
  catch(e){ masterData = []; }
  if(masterData.length===0 && SEED_MASTER_DATA.length>0){ masterData = SEED_MASTER_DATA; await saveMaster(); }
  try{ const r = await window.storage.get('students_data', true); studentsData = r ? JSON.parse(r.value) : {}; }
  catch(e){ studentsData = {}; }
  try{ const r = await window.storage.get('teacher_pins', true); teacherPins = r ? JSON.parse(r.value) : []; }
  catch(e){ teacherPins = []; }
  if(teacherPins.length===0 && SEED_TEACHER_PINS.length>0){ teacherPins = SEED_TEACHER_PINS.slice(); await saveTeacherPins(); }
  try{ const r = await window.storage.get('admin_pin', true); adminPin = r ? r.value : ''; }
  catch(e){ adminPin = ''; }
  try{
    const r = await window.storage.get('my_student_number', false);
    const saved = r ? r.value : '';
    if(saved && studentsData[saved]){ currentStudentNumber = saved; }
  }catch(e){ /* ignore */ }
  loaded = true;
  if(storageIsFallback){
    showBanner('⚠ 지금은 저장이 되지 않는 상태예요. 이 화면은 파일을 직접 열면 저장·공유 기능이 꺼져요 — Claude에서 공유받은 링크로 열어야 정상 동작해요.');
  }
  render();
}

}

function getStudentApplications(s){
  const fromMaster = (s.appliedIds||[]).map(id=>{
    const entry = masterData.find(e=>e.id===id);
    if(!entry) return null;
    const overrideDept = s.appliedMajors && s.appliedMajors[id];
    return overrideDept ? { ...entry, department: overrideDept } : entry;
  }).filter(Boolean);
  const custom = (s.customEntries||[]).map(e=>({ ...e, isCustom:true }));
  return fromMaster.concat(custom);
}

function buildEventList(students){
  const list = [];
  students.forEach(s=>{
    getStudentApplications(s).forEach(entry=>{
      entry.events.forEach(ev=>{
        if(!ev.date) return;
        list.push({ date:ev.date, type:ev.type, note:ev.note, university:entry.university, admissionType:entry.admissionType, department:entry.department, studentName:s.name, studentNumber:s.studentNumber||s.id, className:s.className, isCustom:!!entry.isCustom });
      });
    });
  });
  list.sort((a,b)=>a.date.localeCompare(b.date));
  return list;
}

function parseDateCell(v){
  if(v instanceof Date && !isNaN(v)){ return v.getFullYear()+'-'+pad(v.getMonth()+1)+'-'+pad(v.getDate()); }
  if(typeof v === 'number' && v>20000 && v<80000){
    const d = new Date(Math.round((v-25569)*86400*1000));
    if(!isNaN(d)) return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  }
  const s = String(v==null?'':v).trim();
  const m = s.match(/(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})/);
  if(m) return m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);
  return '';
}
function mapEventType(raw){
  const s = String(raw||'').trim();
  for(const [kw,key] of TYPE_MAP){ if(s.includes(kw)) return {key, matched:true}; }
  return {key:'custom', matched:false};
}
function findHeaderRow(rows){
  for(let i=0;i<Math.min(rows.length,20);i++){
    const row = (rows[i]||[]).map(c=>String(c||'').trim());
    if(row.some(c=>c.includes('날짜')) && row.some(c=>c.includes('대학'))) return i;
  }
  return -1;
}
function buildKey(u,a,d){ return (u||'').trim()+'||'+(a||'').trim()+'||'+(d||'전체').trim(); }

function importRows(headerRow, dataRows){
  const idx = {};
  headerRow.forEach((h,i)=>{
    const t = String(h||'').trim();
    if(idx.date==null && t.includes('날짜')) idx.date=i;
    if(idx.uni==null && t.includes('대학')) idx.uni=i;
    if(idx.adm==null && t.includes('전형')) idx.adm=i;
    if(idx.type==null && (t.includes('구분')||t.includes('유형'))) idx.type=i;
    if(idx.dept==null && (t.includes('학과')||t.includes('모집단위')||t.includes('학부'))) idx.dept=i;
    if(idx.time==null && (t.includes('시각')||t.includes('시간'))) idx.time=i;
    if(idx.note==null && (t.includes('비고')||t.includes('메모'))) idx.note=i;
  });
  if(idx.date==null || idx.uni==null) return { error:"'날짜'와 '대학' 열을 찾지 못했어요. 열 이름을 확인해 주세요." };

  const cloned = JSON.parse(JSON.stringify(masterData));
  const keyIndex = new Map();
  cloned.forEach(e=>keyIndex.set(buildKey(e.university,e.admissionType,e.department), e));

  let addedEntries=0, updatedEntries=0, addedEvents=0, skipped=0;
  const unmatchedTypes = new Set();
  const touchedKeys = new Set();

  dataRows.forEach(row=>{
    const uni = String(row[idx.uni]||'').trim();
    const dateStr = parseDateCell(row[idx.date]);
    if(!uni || !dateStr){ skipped++; return; }
    const adm = idx.adm!=null ? String(row[idx.adm]||'').trim() : '';
    const dept = idx.dept!=null ? String(row[idx.dept]||'').trim() : '';
    const rawType = idx.type!=null ? String(row[idx.type]||'').trim() : '';
    const timeVal = idx.time!=null ? String(row[idx.time]||'').trim() : '';
    const noteVal = idx.note!=null ? String(row[idx.note]||'').trim() : '';
    const admFinal = adm || '전형 미지정';
    const deptFinal = dept || '전체';

    const mapped = mapEventType(rawType);
    if(!mapped.matched) unmatchedTypes.add(rawType || '(미지정)');

    const noteParts = [];
    if(timeVal) noteParts.push(timeVal);
    if(!mapped.matched && rawType) noteParts.push(rawType);
    if(noteVal) noteParts.push(noteVal);
    const note = noteParts.join(' · ');

    const key = buildKey(uni, admFinal, deptFinal);
    let entry = keyIndex.get(key);
    if(!entry){
      entry = { id:uid(), university:uni, admissionType:admFinal, department:deptFinal, events:[] };
      keyIndex.set(key, entry);
      cloned.push(entry);
      addedEntries++;
      touchedKeys.add(key);
    } else if(!touchedKeys.has(key)){
      updatedEntries++;
      touchedKeys.add(key);
    }

    const dup = entry.events.some(ev=>ev.type===mapped.key && ev.date===dateStr && (ev.note||'')===note);
    if(!dup){ entry.events.push({ id:uid(), type:mapped.key, note, date:dateStr }); addedEvents++; }
  });

  return { mergedMasterData:cloned, stats:{addedEntries, updatedEntries, addedEvents, skipped, unmatchedTypes:[...unmatchedTypes]} };
}

  return `

      ${st.unmatchedTypes.length? `<div style="font-size:12px;color:var(--ink-soft);margin-bottom:8px;">인식 못한 '구분' 값: ${st.unmatchedTypes.slice(0,10).map(escapeHtml).join(', ')}${st.unmatchedTypes.length>10?' 외':''} → '기타'로 등록돼요.</div>`:''}

        <button class="btn secondary" id="cancelImportBtn">취소</button>
      </div>
    </div>
  `;
}

function attachAdminGateHandlers(){
  const setupBtn = document.getElementById('adminSetupBtn');
  if(setupBtn){
    const trySetup = async ()=>{
      const val = document.getElementById('adminPinSetupInput').value.trim();
      if(!val){ document.getElementById('adminSetupError').textContent = '코드를 입력해 주세요.'; return; }
      adminPin = val;
      adminUnlocked = true;
      await saveAdminPin();
      render();
    };
    setupBtn.onclick = trySetup;
    document.getElementById('adminPinSetupInput').onkeydown = (e)=>{ if(e.key==='Enter') trySetup(); };
    return;
  }
  const unlockBtn = document.getElementById('adminUnlockBtn');
  if(unlockBtn){
    const tryUnlock = ()=>{
      const val = document.getElementById('adminPinInput').value;
      if(val===adminPin){ adminUnlocked = true; render(); }
      else{ document.getElementById('adminPinError').textContent = '코드가 맞지 않아요.'; }
    };
    unlockBtn.onclick = tryUnlock;
    document.getElementById('adminPinInput').onkeydown = (e)=>{ if(e.key==='Enter') tryUnlock(); };
    return;
  }
  attachAdminHandlers();
}

function attachAdminHandlers(){
  const lockBtn = document.getElementById('adminLockBtn');
  if(lockBtn) lockBtn.onclick = ()=>{ adminUnlocked = false; render(); };

  const fUniInput = document.getElementById('f-university');
  const fDeptDatalist = document.getElementById('f-department-datalist');
  if(fUniInput && fDeptDatalist){
    fUniInput.oninput = ()=>{
      const opts = getRealDepartmentSuggestions(fUniInput.value.trim());
      fDeptDatalist.innerHTML = opts.map(d=>`<option value="${escapeHtml(d)}">`).join('');
    };
  }

  const importFile = document.getElementById('importFile');
  if(importFile){
    importFile.onchange = async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const statusEl = document.getElementById('importStatus');
      statusEl.textContent = '읽는 중…';
      try{
        const isCsv = /\.csv$/i.test(file.name);
        let workbook;
        if(isCsv){
          const text = await file.text();
          workbook = XLSX.read(text, {type:'string'});
        }else{
          const buf = await file.arrayBuffer();
          workbook = XLSX.read(buf, {type:'array', cellDates:true});
        }
        const preferred = workbook.SheetNames.find(n=>n.includes('일정')||n.includes('목록'));
        const order = preferred ? [preferred, ...workbook.SheetNames.filter(n=>n!==preferred)] : workbook.SheetNames;
        let chosen=null, headerIdx=-1;
        for(const name of order){
          const arr = XLSX.utils.sheet_to_json(workbook.Sheets[name], {header:1, raw:true, defval:''});
          const hIdx = findHeaderRow(arr);
          if(hIdx>-1){ chosen=arr; headerIdx=hIdx; break; }
        }
        if(!chosen){ statusEl.textContent = "'날짜'와 '대학' 열이 있는 시트를 찾지 못했어요. 열 이름을 확인해 주세요."; return; }
        const headerRow = chosen[headerIdx];
        const dataRows = chosen.slice(headerIdx+1);
        const result = importRows(headerRow, dataRows);
        if(result.error){ statusEl.textContent = result.error; return; }
        importPreview = result;
        statusEl.textContent = '';
        render();
      }catch(err){
        console.error(err);
        statusEl.textContent = '파일을 읽는 중 문제가 생겼어요. 형식을 확인해 주세요.';
      }
    };
  }
  const confirmImportBtn = document.getElementById('confirmImportBtn');
  if(confirmImportBtn){
    confirmImportBtn.onclick = async ()=>{
      masterData = importPreview.mergedMasterData;
      importPreview = null;
      await saveMaster();
      render();
    };
  }
  const cancelImportBtn = document.getElementById('cancelImportBtn');
  if(cancelImportBtn){ cancelImportBtn.onclick = ()=>{ importPreview=null; render(); }; }

  const form = document.getElementById('entryForm');
  if(form){
    document.getElementById('addEventRowBtn').onclick = ()=>{ draftEvents.push(newDraftEvent()); render(); };
    document.querySelectorAll('[data-remove-ev]').forEach(btn=>{
      btn.onclick = ()=>{ const i=+btn.dataset.removeEv; if(draftEvents.length>1){ draftEvents.splice(i,1); render(); } };
    });
    document.querySelectorAll('.ev-type-select').forEach(sel=>{
      sel.onchange = ()=>{ draftEvents[+sel.dataset.idx].type = sel.value; };
    });
    document.querySelectorAll('.ev-date-input').forEach(inp=>{
      inp.onchange = ()=>{ draftEvents[+inp.dataset.idx].date = inp.value; };
    });
    document.querySelectorAll('.ev-note-input').forEach(inp=>{
      inp.oninput = ()=>{ draftEvents[+inp.dataset.idx].note = inp.value; };
    });
    form.onsubmit = async (e)=>{
      e.preventDefault();
      const university = document.getElementById('f-university').value.trim();
      const admissionType = document.getElementById('f-admissionType').value.trim();
      const department = document.getElementById('f-department').value.trim();
      const events = draftEvents.filter(ev=>ev.date).map(ev=>({id:ev.id, type:ev.type, note:(ev.note||'').trim(), date:ev.date}));
      if(!university || !admissionType || !department){ alert('대학명, 전형명, 학과를 모두 입력해 주세요.'); return; }
      if(events.length===0){ alert('날짜가 입력된 일정을 최소 1개 추가해 주세요.'); return; }
      if(editingId){
        const idx = masterData.findIndex(x=>x.id===editingId);
        if(idx>-1) masterData[idx] = { id:editingId, university, admissionType, department, events };
      }else{
        masterData.push({ id:uid(), university, admissionType, department, events });
      }
      editingId = null; editState = {}; draftEvents=[newDraftEvent()];
      await saveMaster();
      render();
    };
    const cancelBtn = document.getElementById('cancelEditBtn');
    if(cancelBtn) cancelBtn.onclick = ()=>{ editingId=null; editState={}; draftEvents=[newDraftEvent()]; render(); };

    document.querySelectorAll('[data-edit]').forEach(btn=>{
      btn.onclick = ()=>{
        const e = masterData.find(x=>x.id===btn.dataset.edit);
        if(!e) return;
        editingId = e.id;
        editState = { university:e.university, admissionType:e.admissionType, department:e.department };
        draftEvents = e.events.map(ev=>({id:ev.id, type:ev.type, note:ev.note||'', date:ev.date}));
        if(draftEvents.length===0) draftEvents=[newDraftEvent()];
        render();
        document.getElementById('entryForm').scrollIntoView({behavior:'smooth', block:'start'});
      };
    });
    document.querySelectorAll('[data-delete]').forEach(btn=>{
      btn.onclick = async ()=>{
        if(!confirm('이 전형을 삭제할까요? 학생들의 캘린더에서도 사라져요.')) return;
        masterData = masterData.filter(x=>x.id!==btn.dataset.delete);
        await saveMaster();
        render();
      };
    });
  }

  const applyClassCountBtn = document.getElementById('applyClassCountBtn');
  if(applyClassCountBtn){
    applyClassCountBtn.onclick = async ()=>{
      const newCount = parseInt(document.getElementById('classCountInput').value, 10) || 1;
      const oldCount = getAutoClassCount();
      if(newCount < oldCount){
        if(!confirm(`${oldCount}반에서 ${newCount}반으로 줄일까요? ${newCount+1}반부터 ${oldCount}반까지의 코드가 삭제돼요.`)) return;
      }
      setAutoClassCount(newCount);
      await saveTeacherPins();
      render();
    };
  }
  const addPinBtn = document.getElementById('addPinBtn');
  if(addPinBtn){
    addPinBtn.onclick = async ()=>{
      const label = document.getElementById('pin-label').value.trim();
      const className = document.getElementById('pin-class').value.trim();
      const pin = document.getElementById('pin-code').value.trim();
      if(!label || !pin){ alert('이름표와 코드를 입력해 주세요.'); return; }
      if(teacherPins.some(p=>p.pin===pin)){ alert('이미 사용 중인 코드예요. 다른 코드를 입력해 주세요.'); return; }
      teacherPins.push({ id:uid(), label, className, pin });
      await saveTeacherPins();
      render();
    };
  }
  document.querySelectorAll('[data-delete-pin]').forEach(btn=>{
    btn.onclick = async ()=>{
      if(!confirm('이 코드를 삭제할까요?')) return;
      teacherPins = teacherPins.filter(p=>p.id!==btn.dataset.deletePin);
      await saveTeacherPins();
      render();
    };
  });
  document.querySelectorAll('[data-delete-student]').forEach(btn=>{
    btn.onclick = async ()=>{
      const id = btn.dataset.deleteStudent;
      const s = studentsData[id];
      if(!confirm(`${s? s.name : '이 학생'}의 기록을 삭제할까요? 되돌릴 수 없어요.`)) return;
      delete studentsData[id];
      try{ await window.storage.set('students_data', JSON.stringify(studentsData), true); }
      catch(e){ console.error(e); showBanner('저장 중 문제가 생겼어요. 인터넷 연결을 확인하고 다시 시도해 주세요.'); }
      render();
    };
  });

  const setAdminPinBtn = document.getElementById('setAdminPinBtn');
  if(setAdminPinBtn){
    setAdminPinBtn.onclick = async ()=>{
      const val = document.getElementById('admin-pin-input').value.trim();
      if(!val){ alert('코드를 입력해 주세요.'); return; }
      adminPin = val;
      await saveAdminPin();
      render();
    };
  }
}

function normalizeUniName(name){
  let n = String(name||'').replace(/\(.*?\)/g, '');
  UNI_ABBR_PAIRS.forEach(([a,b])=>{ n = n.split(a).join(b); });
  return n.trim();
}

/* ---------------- STUDENT ---------------- */
const NON_UNIVERSITY_LABELS = new Set(['대학수학능력시험','수능']);
function getUniversityOptions(){
  return [...new Set(masterData.map(e=>e.university).filter(u=>!NON_UNIVERSITY_LABELS.has(u)))].sort((a,b)=>a.localeCompare(b,'ko'));
}
function getAdmissionTypeOptions(uni){
  return [...new Set(masterData.filter(e=>e.university===uni).map(e=>e.admissionType))].sort((a,b)=>a.localeCompare(b,'ko'));
}
const GENERIC_ADMISSION_WORDS = new Set(['전체','공통','전형 미지정','모든 전형','전 전형','해당전형','해당 전형']);
const ADMISSION_SUBSTEP_PATTERN = /(입력|업로드|제출|해당자|우편|방문|확인|대상자|등록자|소인|명단)/;
const ADMISSION_DEPT_SUFFIX_PATTERN = /(학과|학부|전공|캠퍼스|과)$/;
const ADMISSION_CATCHALL_PATTERN = /(외\s*모든\s*전형|그\s*외\s*전형|기타\s*전형|이외\s*전형)/;
function looksLikeRealAdmissionType(a){
  if(GENERIC_ADMISSION_WORDS.has(a)) return false;
  if(ADMISSION_SUBSTEP_PATTERN.test(a)) return false;
  if(ADMISSION_DEPT_SUFFIX_PATTERN.test(a.trim())) return false;
  if(ADMISSION_CATCHALL_PATTERN.test(a)) return false;
  return true;
}
function getAdmissionTypeOptionsFiltered(uni){
  const opts = getAdmissionTypeOptions(uni);
  const cleaned = opts.filter(looksLikeRealAdmissionType);
  if(cleaned.length > 0) return cleaned;
  // 전부 걸러졌으면 최소한 '전체' 계열 표시어라도 남겨서 목록이 비지 않게 함
  const nonGeneric = opts.filter(a=>!GENERIC_ADMISSION_WORDS.has(a));
  if(nonGeneric.length > 0) return nonGeneric;
  return opts;
}
function getDepartmentOptions(uni, admType){
  return [...new Set(masterData.filter(e=>e.university===uni && e.admissionType===admType).map(e=>e.department))].sort((a,b)=>a.localeCompare(b,'ko'));
}
function findMasterEntry(uni, admType, dept){
  return masterData.find(e=>e.university===uni && e.admissionType===admType && e.department===dept);
}
function getDepartmentSearchOptions(uni, admType){
  const real = getRealDepartmentSuggestions(uni);
  const registered = getDepartmentOptions(uni, admType);
  return [...new Set([...registered, ...real])].sort((a,b)=>a.localeCompare(b,'ko'));
}
/* 정확히 일치하는 학과가 없어도, 그 대학·전형에 등록된 항목이 하나뿐이면
   입력한 학과명을 '내가 지원하는 학과' 메모로 남기고 그 항목에 연결해줌 */
function resolveEntryAndMajor(uni, admType, deptTyped){
  const exact = findMasterEntry(uni, admType, deptTyped);
  if(exact) return { entry: exact, major: deptTyped };
  const candidates = masterData.filter(e=>e.university===uni && e.admissionType===admType);
  if(candidates.length===1 && deptTyped){
    return { entry: candidates[0], major: deptTyped };
  }
  return { entry:null, major:null };
}

function getNextEventForEntry(entry){
  const today = todayStr();
  const withDates = (entry.events||[]).filter(ev=>ev.date);
  if(withDates.length===0) return null;
  const future = withDates.filter(ev=>ev.date>=today).sort((a,b)=>a.date.localeCompare(b.date));
  if(future.length>0) return future[0];
  return withDates.slice().sort((a,b)=>b.date.localeCompare(a.date))[0];
}

function renderApplicationSummaryTable(applied){
  if(applied.length===0) return '';
  const rows = applied.map(entry=>({ entry, nextEv: getNextEventForEntry(entry) }));
  rows.sort((a,b)=>{
    if(!a.nextEv && !b.nextEv) return 0;
    if(!a.nextEv) return 1;
    if(!b.nextEv) return -1;
    return a.nextEv.date.localeCompare(b.nextEv.date);
  });
  return `
    <div class="section-title">지원 현황 요약</div>
    <div class="section-desc">지원한 대학의 다음 일정과 D-day를 한눈에 볼 수 있어요.</div>
    <table class="sched" style="margin-bottom:20px;">
      <thead><tr><th>대학</th><th>전형 / 학과</th><th>다음 일정</th><th>날짜</th><th>D-day</th></tr></thead>
      <tbody>
        ${rows.map(({entry, nextEv})=>{
          if(!nextEv){
            return `<tr>
              <td data-label="대학">${escapeHtml(entry.university)}</td>
              <td data-label="전형/학과">${escapeHtml(entry.admissionType)} · ${escapeHtml(entry.department)}</td>
              <td data-label="다음 일정" colspan="3" style="color:var(--ink-soft);">등록된 일정 없음</td>
            </tr>`;
          }
          const dd = ddayInfo(nextEv.date);
          const today = todayStr();
          return `<tr class="${nextEv.date===today?'today':''}">
            <td data-label="대학">${escapeHtml(entry.university)}</td>
            <td data-label="전형/학과">${escapeHtml(entry.admissionType)} · ${escapeHtml(entry.department)}</td>
            <td data-label="다음 일정"><span class="evtype"><span class="dot" style="background:${eventColor(nextEv)}"></span>${escapeHtml(eventLabel(nextEv))}</span></td>
            <td data-label="날짜">${fmtDate(nextEv.date)}</td>
            <td data-label="D-day"><span class="dday ${dd.cls}">${dd.label}</span></td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  `;
}

function attachUniversityPicker(){
  const uniSelect = document.getElementById('pick-university-select');
  const uniCustom = document.getElementById('pick-university-custom');
  const admSelect = document.getElementById('pick-admission-select');
  const admCustom = document.getElementById('pick-admission-custom');
  const deptSelect = document.getElementById('pick-department-select');
  const deptCustom = document.getElementById('pick-department-custom');
  const statusArea = document.getElementById('pickStatusArea');
  const addBtn = document.getElementById('pickAddBtn');
  if(!uniSelect || !admSelect || !deptSelect || !addBtn) return;

  const CUSTOM = '__custom__';
  function currentUniversity(){
    return uniSelect.value===CUSTOM ? uniCustom.value.trim() : uniSelect.value;
  }
  function currentAdmission(){
    return admSelect.value===CUSTOM ? admCustom.value.trim() : admSelect.value;
  }
  function currentDepartment(){
    return deptSelect.value===CUSTOM ? deptCustom.value.trim() : deptSelect.value;
  }

  function refreshAdmissionOptions(){
    const uni = currentUniversity();
    const opts = uni ? getAdmissionTypeOptionsFiltered(uni) : [];
    admCustom.style.display = 'none';
    admCustom.value = '';
    if(!uni){
      admSelect.disabled = true;
      admSelect.innerHTML = '<option value="">대학을 먼저 선택하세요</option>';
      return;
    }
    admSelect.disabled = false;
    const optionsHtml = opts.map(a=>`<option value="${escapeHtml(a)}">${escapeHtml(a)}</option>`).join('');
    admSelect.innerHTML = `<option value="">전형 선택</option>${optionsHtml}<option value="${CUSTOM}">직접 입력...</option>`;
    // 전형이 하나뿐이면 자동으로 채워줌
    if(opts.length===1){ admSelect.value = opts[0]; }
  }
  function refreshDepartmentOptions(){
    const uni = currentUniversity();
    const adm = currentAdmission();
    const registered = (uni && adm) ? getDepartmentOptions(uni, adm) : [];
    const opts = (uni && adm) ? getDepartmentSearchOptions(uni, adm) : [];
    deptCustom.style.display = 'none';
    deptCustom.value = '';
    if(!uni || !adm){
      deptSelect.disabled = true;
      deptSelect.innerHTML = '<option value="">전형을 먼저 선택하세요</option>';
      return;
    }
    deptSelect.disabled = false;
    const optionsHtml = opts.map(d=>`<option value="${escapeHtml(d)}">${escapeHtml(d)}</option>`).join('');
    deptSelect.innerHTML = `<option value="">학과 선택</option>${optionsHtml}<option value="${CUSTOM}">직접 입력...</option>`;
    // 등록된 학과 선택지가 하나뿐이면(대부분 '전체') 자동으로 채워줌
    if(registered.length===1){ deptSelect.value = registered[0]; }
  }
  function refreshStatus(){
    const uni = currentUniversity();
    const adm = currentAdmission();
    const dept = currentDepartment();
    const me = studentsData[currentStudentNumber];
    if(!uni || !adm || !dept){
      statusArea.textContent = '';
      addBtn.disabled = true;
      addBtn.textContent = '지원';
      delete addBtn.dataset.entryId;
      delete addBtn.dataset.major;
      return;
    }
    const { entry, major } = resolveEntryAndMajor(uni, adm, dept);
    if(!entry){
      statusArea.textContent = '일치하는 전형을 찾지 못했어요. 철자를 확인하거나, 아래 "직접 추가하기"로 새로 등록해 보세요.';
      addBtn.disabled = true;
      addBtn.textContent = '지원';
      delete addBtn.dataset.entryId;
      delete addBtn.dataset.major;
      return;
    }
    const already = (me.appliedIds||[]).includes(entry.id);
    statusArea.textContent = already ? '이미 지원한 전형이에요.' : (major!==entry.department ? `"${entry.department}" 전형에 "${major}" 학과로 기록돼요.` : '');
    addBtn.disabled = already;
    addBtn.textContent = already ? '이미 지원함' : '지원';
    addBtn.dataset.entryId = entry.id;
    addBtn.dataset.major = major;
  }

  uniSelect.onchange = ()=>{
    if(uniSelect.value===CUSTOM){ uniCustom.style.display='block'; uniCustom.value=''; uniCustom.focus(); }
    else{ uniCustom.style.display='none'; uniCustom.value=''; }
    refreshAdmissionOptions();
    refreshDepartmentOptions();
    refreshStatus();
  };
  uniCustom.oninput = ()=>{ refreshAdmissionOptions(); refreshDepartmentOptions(); refreshStatus(); };
  admSelect.onchange = ()=>{
    if(admSelect.value===CUSTOM){ admCustom.style.display='block'; admCustom.value=''; admCustom.focus(); }
    else{ admCustom.style.display='none'; admCustom.value=''; }
    refreshDepartmentOptions();
    refreshStatus();
  };
  admCustom.oninput = ()=>{ refreshDepartmentOptions(); refreshStatus(); };
  deptSelect.onchange = ()=>{
    if(deptSelect.value===CUSTOM){ deptCustom.style.display='block'; deptCustom.value=''; deptCustom.focus(); }
    else{ deptCustom.style.display='none'; deptCustom.value=''; }
    refreshStatus();
  };
  deptCustom.oninput = ()=>{ refreshStatus(); };

  addBtn.onclick = async ()=>{
    const id = addBtn.dataset.entryId;
    const major = addBtn.dataset.major;
    if(!id) return;
    const me = studentsData[currentStudentNumber];
    if(!me.appliedIds.includes(id)){
      me.appliedIds.push(id);
      const entry = masterData.find(e=>e.id===id);
      if(entry && major && major!==entry.department){
        me.appliedMajors = me.appliedMajors || {};
        me.appliedMajors[id] = major;
      }
      await saveStudentsData();
    }
    render();
  };

  refreshAdmissionOptions();
  refreshDepartmentOptions();
  refreshStatus();
}

function attachStudentHandlers(){
  const loginBtn = document.getElementById('loginBtn');
  if(loginBtn){
    const tryLogin = async ()=>{
      const num = document.getElementById('login-number').value.trim();
      const name = document.getElementById('login-name').value.trim();
      const errEl = document.getElementById('loginError');
      if(!num || !name){ errEl.textContent = '학번과 이름을 모두 입력해 주세요.'; return; }
      const existing = studentsData[num];
      if(existing){
        if(existing.name.trim() !== name){ errEl.textContent = '학번과 이름이 일치하지 않아요. 다시 확인해 주세요.'; return; }
        currentStudentNumber = num;
      }else{
        const className = deriveClassName(num);
        studentsData[num] = { id:num, studentNumber:num, name, className, appliedIds:[] };
        currentStudentNumber = num;
      }
      await saveMyStudentNumber();
      await saveStudentsData();
      render();
    };
    loginBtn.onclick = tryLogin;
    ['login-number','login-name'].forEach(id=>{
      const el = document.getElementById(id);
      if(el) el.onkeydown = (e)=>{ if(e.key==='Enter') tryLogin(); };
    });
    return;
  }

  const nameInput = document.getElementById('f-name');
  const classInput = document.getElementById('f-class');
  if(nameInput) nameInput.onchange = async ()=>{ studentsData[currentStudentNumber].name = nameInput.value.trim(); await saveStudentsData(); };
  if(classInput) classInput.onchange = async ()=>{ studentsData[currentStudentNumber].className = classInput.value.trim(); await saveStudentsData(); };

  attachUniversityPicker();
  document.querySelectorAll('[data-remove]').forEach(btn=>{
    btn.onclick = async ()=>{
      const me = studentsData[currentStudentNumber];
      const id = btn.dataset.remove;
      if((me.appliedIds||[]).includes(id)){
        me.appliedIds = me.appliedIds.filter(x=>x!==id);
        if(me.appliedMajors){ delete me.appliedMajors[id]; }
      } else {
        me.customEntries = (me.customEntries||[]).filter(x=>x.id!==id);
      }
      await saveStudentsData();
      render();
    };
  });
  document.querySelectorAll('.view-switch button').forEach(btn=>{
    btn.onclick = ()=>{ currentView = btn.dataset.view; render(); };
  });

  const toggleManual = document.getElementById('toggleStudentManual');
  if(toggleManual) toggleManual.onclick = ()=>{ studentManualOpen = !studentManualOpen; if(studentManualOpen) studentDraftEvents=[newDraftEvent()]; render(); };

  if(studentManualOpen){
    const smUniInput = document.getElementById('sm-university');
    const smDeptDatalist = document.getElementById('sm-department-datalist');
    if(smUniInput && smDeptDatalist){
      smUniInput.oninput = ()=>{
        const opts = getRealDepartmentSuggestions(smUniInput.value.trim());
        smDeptDatalist.innerHTML = opts.map(d=>`<option value="${escapeHtml(d)}">`).join('');
      };
    }
    const addRowBtn = document.getElementById('smAddEventRowBtn');
    if(addRowBtn) addRowBtn.onclick = ()=>{ studentDraftEvents.push(newDraftEvent()); render(); };
    document.querySelectorAll('[data-sm-remove-ev]').forEach(btn=>{
      btn.onclick = ()=>{ const i=+btn.dataset.smRemoveEv; if(studentDraftEvents.length>1){ studentDraftEvents.splice(i,1); render(); } };
    });
    document.querySelectorAll('.sm-type-select').forEach(sel=>{
      sel.onchange = ()=>{ studentDraftEvents[+sel.dataset.idx].type = sel.value; };
    });
    document.querySelectorAll('.sm-date-input').forEach(inp=>{
      inp.onchange = ()=>{ studentDraftEvents[+inp.dataset.idx].date = inp.value; };
    });
    document.querySelectorAll('.sm-note-input').forEach(inp=>{
      inp.oninput = ()=>{ studentDraftEvents[+inp.dataset.idx].note = inp.value; };
    });
    const smSubmitBtn = document.getElementById('smSubmitBtn');
    if(smSubmitBtn){
      smSubmitBtn.onclick = async ()=>{
        const university = document.getElementById('sm-university').value.trim();
        const admissionType = document.getElementById('sm-admissionType').value.trim();
        const department = document.getElementById('sm-department').value.trim() || '전체';
        const events = studentDraftEvents.filter(ev=>ev.date).map(ev=>({id:uid(), type:ev.type, note:ev.note.trim(), date:ev.date}));
        if(!university || !admissionType){ alert('대학명과 전형명을 입력해 주세요.'); return; }
        if(events.length===0){ alert('날짜가 입력된 일정을 최소 1개 추가해 주세요.'); return; }
        const newEntry = { id:uid(), university, admissionType, department, events };
        const me = studentsData[currentStudentNumber];
        me.customEntries = me.customEntries || [];
        me.customEntries.push(newEntry);
        await saveStudentsData();
        studentDraftEvents = [newDraftEvent()];
        studentManualOpen = false;
        render();
      };
    }
  }

  bindCalendarNav('student');
}

      </tr></thead>
      <tbody>
        ${events.map(ev=>{
          const dd = ddayInfo(ev.date);
          return `<tr class="${ev.date===today?'today':''}">
            <td data-label="날짜">${fmtDate(ev.date)}</td>
            <td data-label="D-day"><span class="dday ${dd.cls}">${dd.label}</span></td>

          </tr>`;
        }).join('')}
      </tbody>
    </table>
  `;
}

function renderCalendarBlock(events, opts){
  const monthDate = opts.monthState==='teacher' ? teacherCalMonth : calMonth;
  const selDay = opts.monthState==='teacher' ? teacherSelectedDay : selectedDay;
  const byDate = {};
  events.forEach(ev=>{ (byDate[ev.date]=byDate[ev.date]||[]).push(ev); });

  const year = monthDate.getFullYear(), month = monthDate.getMonth();
  const firstDow = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const today = todayStr();
  const dowClass = i => i===0 ? 'sun' : (i===6 ? 'sat' : '');

  let cells = '';
  const MAX_ROWS = 3;
  for(let i=0;i<firstDow;i++) cells += `<div class="cal-cell blank"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = year+'-'+pad(month+1)+'-'+pad(d);
    const evs = byDate[dateStr]||[];
    const isToday = dateStr===today;
    const isSel = dateStr===selDay;
    const rows = evs.slice(0,MAX_ROWS).map(ev=>{
      const label = opts.showStudent
        ? `${ev.studentName}(${ev.studentNumber}) · ${ev.university}`
        : `${ev.university} · ${EVENT_TYPES[ev.type]?EVENT_TYPES[ev.type].label:'기타'}`;
      return `
      <div class="cal-event-row" title="${escapeHtml(ev.university)} · ${escapeHtml(eventLabel(ev))}${opts.showStudent?` · ${escapeHtml(ev.studentName)}(${escapeHtml(ev.studentNumber)})`:''}">
        <span class="dot" style="background:${eventColor(ev)}"></span>
        <span class="cal-event-text">${escapeHtml(label)}</span>
      </div>
    `;
    }).join('');
    const more = evs.length>MAX_ROWS ? `<div class="cal-event-more">+${evs.length-MAX_ROWS}건 더</div>` : '';
    const wd = (firstDow + d - 1) % 7;
    cells += `<div class="cal-cell ${isToday?'is-today':''} ${isSel?'selected':''}" data-day="${dateStr}" data-cal="${opts.monthState}">
      <span class="num ${dowClass(wd)}">${d}</span>
      <div class="cal-dots">${rows}${more}</div>
    </div>`;
  }

  const monthLabel = `${year}년 ${month+1}월`;
  const dowNames = ['일','월','화','수','목','금','토'];

  const detail = selDay && byDate[selDay] ? `
    <div class="day-detail">
      <h4>${fmtDate(selDay)}</h4>
      ${byDate[selDay].map(ev=>`
        <div class="detail-row">
          <span class="dot lg" style="background:${eventColor(ev)};margin-top:5px;"></span>
          <div>
            <div><b>${escapeHtml(ev.university)}</b> · ${escapeHtml(ev.admissionType)} · ${escapeHtml(ev.department)}${opts.showStudent && ev.isCustom ? ' <span style="color:var(--accent);font-size:11px;">(학생 입력)</span>' : ''}</div>
            <div style="color:var(--ink-soft);">${escapeHtml(eventLabel(ev))}${opts.showStudent?` · ${escapeHtml(ev.studentName)}(${escapeHtml(ev.studentNumber)}, ${escapeHtml(ev.className||'')})`:''}</div>
          </div>
        </div>
      `).join('')}
    </div>
  ` : (selDay ? `<div class="day-detail"><span style="color:var(--ink-soft);">이 날은 일정이 없어요.</span></div>` : '');

  return `
    <div class="calendar-card">
      <div class="cal-head">
        <h3>${monthLabel}</h3>
        <div class="cal-nav">
          <button data-nav="prev" data-cal="${opts.monthState}">‹</button>
          <button data-nav="next" data-cal="${opts.monthState}">›</button>
        </div>
      </div>
      <div class="cal-grid">
        ${dowNames.map((n,i)=>`<div class="cal-dow ${dowClass(i)}">${n}</div>`).join('')}
        ${cells}
      </div>
      <div class="legend">
        ${Object.values(EVENT_TYPES).map(v=>`<span><span class="dot lg" style="background:${v.color}"></span>${v.label}</span>`).join('')}
      </div>
    </div>
    ${detail}
  `;
}

function bindCalendarNav(which){
  document.querySelectorAll(`[data-nav][data-cal="${which}"]`).forEach(btn=>{
    btn.onclick = ()=>{
      const dir = btn.dataset.nav==='next' ? 1 : -1;
      if(which==='teacher'){ teacherCalMonth = new Date(teacherCalMonth.getFullYear(), teacherCalMonth.getMonth()+dir, 1); }
      else{ calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()+dir, 1); }
      render();
    };
  });
  document.querySelectorAll(`.cal-cell[data-day][data-cal="${which}"]`).forEach(cell=>{
    cell.onclick = ()=>{
      const d = cell.dataset.day;
      if(which==='teacher'){ teacherSelectedDay = teacherSelectedDay===d ? null : d; }
      else{ selectedDay = selectedDay===d ? null : d; }
      render();
    };
  });
}

function attachHandlers(){
  if(currentTab==='admin') attachAdminGateHandlers();
  else if(currentTab==='teacher') attachTeacherGateHandlers();
  else attachStudentHandlers();
}

loadAll();
</script>
</body>
</html>
